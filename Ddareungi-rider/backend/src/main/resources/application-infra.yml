spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/ddareungi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${MYSQL_USER:ddareungi}
    password: ${MYSQL_PASSWORD:ddareungi}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

realtime:
  redis:
    # auto (default): versioned layout when station:realtime:current exists, else legacy per-station hashes.
    # legacy: only station:realtime:{stationId}. versioned: only current + station:realtime:v{n} (no fallback).
    # Key names/value JSON are a design proposal (API spec v5 21.2) until the collector implements R2.
    read-mode: ${REALTIME_REDIS_READ_MODE:auto}

management:
  endpoint:
    health:
      group:
        readiness:
          # Redis is intentionally excluded: when it is down the API keeps serving (degraded), so
          # taking the instance out of rotation would turn a partial outage into a full one.
          include: readinessState,db

seoul-bike:
  api:
    base-url: ${SEOUL_API_BASE_URL:http://openapi.seoul.go.kr:8088}
    key: ${SEOUL_API_KEY}
    page-size: 1000
    max-pages: 5
    realtime-service: bikeList
    refresh-cron: ${REALTIME_REFRESH_CRON:0 * * * * *}
