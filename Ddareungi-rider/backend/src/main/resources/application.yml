spring:
  application:
    name: ddareungrider
  # Request threads mostly block on Redis/MySQL/Kakao I/O; virtual threads avoid pool exhaustion.
  threads:
    virtual:
      enabled: true
  profiles:
    default: local
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 20s
  data:
    redis:
      timeout: 2s
      repositories:
        enabled: false

management:
  # Actuator runs on a separate internal port; only the API port (8080) is published.
  server:
    port: ${MANAGEMENT_SERVER_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
  # Viewport/nearby responses can contain thousands of stations; gzip cuts payload size several-fold.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

logging:
  pattern:
    # Inserted into Boot's default console/file patterns; the request id comes from RequestIdFilter (MDC).
    correlation: "[%X{requestId:-}] "

routing:
  provider: kakao
  enabled: true
  ors:
    api-key: ${ORS_API_KEY:}

kakao:
  maps:
    rest-api-key: ${KAKAO_MAPS_REST_API_KEY:}
