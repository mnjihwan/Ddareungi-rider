# ddareungrider site - install as /etc/nginx/conf.d/ddareungi.conf (http context).
# Requires:
#   /etc/nginx/ddareungi/upstream-backend.conf   (written atomically by deploy.sh; initial copy from upstream-backend.conf)
#   /etc/nginx/ddareungi/locations.conf          (this directory's locations.conf)
#   /srv/ddareungi/web/current -> releases/<id>  (web bundle, switched by deploy.sh)
# Placeholders: <DOMAIN> (e.g. rider.example.com), TLS certificate paths. See docs/deploy-ec2.md.

include /etc/nginx/ddareungi/upstream-backend.conf;

# Public HTTP. Until TLS is configured this serves the app directly; once TLS is ready, replace the
# body with the redirect below (keep the ACME location if you use certbot webroot).
server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    # location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    # location / { return 301 https://$host$request_uri; }

    include /etc/nginx/ddareungi/locations.conf;
}

# Public HTTPS - TLS placeholder. Enable after choosing the certificate method (certbot / ACM+ALB / other).
# If an ALB or CloudFront terminates TLS in front of nginx, $remote_addr becomes the load balancer address:
# configure ngx_http_realip_module (set_real_ip_from <LB CIDR>; real_ip_header X-Forwarded-For;) first,
# otherwise every client shares one rate-limit key (mass HTTP 429).
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name <DOMAIN>;
#     ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_session_cache shared:SSL:10m;
#     add_header Strict-Transport-Security "max-age=31536000" always;
#     include /etc/nginx/ddareungi/locations.conf;
# }

# Internal smoke endpoint for deploy.sh: same locations, loopback only, unaffected by TLS/redirect changes.
server {
    listen 127.0.0.1:18080;
    server_name _;
    access_log off;
    include /etc/nginx/ddareungi/locations.conf;
}
