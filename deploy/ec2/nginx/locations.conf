# Shared locations for the public and the internal smoke server. Install as /etc/nginx/ddareungi/locations.conf.

root /srv/ddareungi/web/current;
index index.html;
server_tokens off;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# API -> active backend color (upstream ddareungi_backend from upstream-backend.conf).
location /api/ {
    proxy_pass http://ddareungi_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (never append) client-supplied forwarding headers: the backend runs with
    # SERVER_FORWARD_HEADERS_STRATEGY=native and keys its rate limit on the resulting client address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # Do not retry non-idempotent route searches on another server; there is one upstream server anyway.
    proxy_next_upstream off;
}

# Actuator is only on the unpublished management port; make sure the SPA fallback never answers for it.
location ^~ /actuator {
    return 404;
}

# Vite hashed assets: safe to cache forever.
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

# Entry document must be revalidated so a deploy is picked up immediately.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

# SPA: unknown paths fall back to index.html; other public files (favicon, branding) are revalidated.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
