name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend test and bootJar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Ddareungi-rider
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            Ddareungi-rider/**/*.gradle*
            Ddareungi-rider/gradle/wrapper/gradle-wrapper.properties

      - name: Test and build jar
        run: ./gradlew :backend:test :backend:bootJar --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            Ddareungi-rider/backend/build/reports/tests/
            Ddareungi-rider/backend/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  web:
    name: Web typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Ddareungi-rider/web
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Ddareungi-rider/web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image build (no push)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Build backend image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --tag ddareungi-rider-backend:ci-${{ github.sha }} Ddareungi-rider
